
#môi trường prod chạy thật,lấy những biến set đó trong env bắt buộc
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Dùng Flyway migration thay vì Hibernate tự động cập nhật schema
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET}
  duration: ${JWT_DURATION}

admin:
  default:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}

qrcode:
  bank:
    bank-id: ${QRCODE_BANK_ID}
    account: ${QRCODE_BANK_ACCOUNT}
    template: ${QRCODE_BANK_TEMPLATE}
    name: ${QRCODE_BANK_NAME}

casso:
  webhook:
    secret-key: ${CASSO_WEBHOOK_SECRET_KEY}

