  flyway:
    enabled: true
    locations: classpath:db/migration
    # DB dev hiện đã có bảng + dữ liệu, nhưng chưa có bảng lịch sử Flyway.
    # Cho phép Flyway tự baseline ở version 1 để KHÔNG chạy lại V1__init.sql trên DB đang có dữ liệu.
    baseline-on-migrate: true
    baseline-version: 1

