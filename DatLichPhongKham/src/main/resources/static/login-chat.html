<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập để chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 24px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
            width: 360px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 4px;
            text-align: center;
        }
        .subtitle {
            margin: 0 0 16px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }
        .field {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            padding: 9px 0;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            margin-top: 8px;
            color: #b91c1c;
            font-size: 13px;
            min-height: 18px;
        }
        .info {
            margin-top: 10px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Đăng nhập chat</h2>
    <p class="subtitle">Bệnh nhân, bác sĩ, nhân viên đăng nhập để sử dụng chat real-time</p>

    <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" type="text" placeholder="Nhập username..." autocomplete="username">
    </div>
    <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" placeholder="Nhập mật khẩu..." autocomplete="current-password">
    </div>

    <button id="btnLogin" onclick="login()">Đăng nhập</button>

    <div id="error" class="error"></div>

    <p class="info">
        Sau khi đăng nhập thành công, hệ thống sẽ lưu JWT vào <strong>localStorage</strong> và chuyển sang trang
        <code>chat.html</code>. Trang chat sẽ đọc token này để kết nối WebSocket và gửi tin nhắn.
    </p>
</div>

<script>
    async function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorEl = document.getElementById("error");
        const btn = document.getElementById("btnLogin");

        errorEl.textContent = "";

        if (!username || !password) {
            errorEl.textContent = "Vui lòng nhập đủ username và password.";
            return;
        }

        btn.disabled = true;

        try {
            const res = await fetch("/api/auth/signin", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ userName: username, password: password })
            });

            const data = await res.json();

            if (!res.ok || data.code !== "OK") {
                const msg = data.message || (data.error && data.error.message) || "Đăng nhập thất bại";
                errorEl.textContent = msg;
                btn.disabled = false;
                return;
            }

            // data.data.token theo SuccessReponse<SignInResponse>
            const signInData = data.data || data;
            if (!signInData.token) {
                errorEl.textContent = "Không nhận được token từ server.";
                btn.disabled = false;
                return;
            }

            // Lưu token để trang chat.html dùng lại
            localStorage.setItem("chat_jwt", signInData.token);

            // lấy role từ user trong SignInResponse
            const role = signInData.user && signInData.user.role ? signInData.user.role : null;
            // lưu role để dùng ở các trang khác
            if (role) {
                localStorage.setItem("chat_role", role);
            }

            if (role === "USER") {
                // Bệnh nhân: chuyển sang trang chọn/xem bác sĩ (ví dụ doctor-detail hoặc trang danh sách)
                window.location.href = "/doctors.html";
            } else if (role === "DOCTOR" || role === "EMPLOYEE" || role === "ADMIN") {
                // Bác sĩ, nhân viên, admin: dùng màn hình chat chính
                window.location.href = "/chat.html";
            } else {
                errorEl.textContent = "Role không hợp lệ: " + role;
            }
        } catch (e) {
            console.error(e);
            errorEl.textContent = "Có lỗi khi kết nối server.";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
